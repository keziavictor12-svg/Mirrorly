<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081716" />
    <title>Mirrorly DeepAR Test</title>
    <link rel="stylesheet" href="deepar-test.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">MIRRORLY AR PROVIDER TEST</p>
      <h1>DeepAR Web SDK</h1>
      <p id="status" class="status">Checking the local SDK...</p>
      <div id="deeparRoot" class="preview" aria-label="DeepAR camera preview"></div>
      <div class="sample-controls">
        <label for="effectSelect">Free-package sample effect</label>
        <select id="effectSelect" disabled></select>
        <button id="applyEffectButton" disabled>Apply effect</button>
      </div>
      <div class="actions">
        <button id="startButton" disabled>Start DeepAR camera</button>
        <a href="/">Return to Mirrorly</a>
      </div>
      <p class="note">These are SDK test effects, not salon hairstyles. This lab is isolated from Mirrorly's Optional AI Photo workflow.</p>
    </main>
    <script type="module" src="deepar-test.js"></script>
  </body>
</html>
