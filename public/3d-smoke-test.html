<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mirrorly 3D asset smoke test</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; color: #f4dfb6; background: #071112; font: 14px system-ui; }
      canvas { display: block; width: 100%; height: 100%; }
      #status { position: fixed; top: 16px; left: 16px; z-index: 1; padding: 9px 12px; border: 1px solid #345; border-radius: 999px; background: rgba(4, 12, 13, .82); }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.min.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <p id="status">Loading CC0 GLB hairstyles…</p>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      document.querySelector("#status").textContent = "Module graph loaded; creating WebGL renderer…";
      document.body.dataset.moduleStatus = "passed";

      const loader = new GLTFLoader();
      let loadedAssets;
      try {
        loadedAssets = await Promise.all([
          loader.loadAsync("./assets/models/bob-cc0.glb"),
          loader.loadAsync("./assets/models/short-cc0.glb")
        ]);
        document.querySelector("#status").textContent = "GLB meshes parsed; creating WebGL renderer…";
        document.body.dataset.assetStatus = "passed";
      } catch (error) {
        document.querySelector("#status").textContent = `FAIL — ${error.message}`;
        document.body.dataset.assetStatus = "failed";
        throw error;
      }

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      document.body.append(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 100);
      camera.position.set(0, 0.2, 7);
      scene.add(new THREE.HemisphereLight(0xffead2, 0x152728, 2));
      const key = new THREE.DirectionalLight(0xffd7a4, 3);
      key.position.set(-3, 4, 5);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x9bd8d2, 2);
      rim.position.set(4, 1, 2);
      scene.add(rim);

      const group = new THREE.Group();
      scene.add(group);

      function fitModel(root, x, tint) {
        root.traverse((object) => {
          if (!object.isMesh) return;
          if (!object.geometry.attributes.normal) object.geometry.computeVertexNormals();
          object.material = object.material.clone();
          object.material.color.set(tint);
          object.material.side = THREE.DoubleSide;
          object.material.alphaTest = 0.04;
          object.material.transparent = true;
        });
        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        root.position.sub(center);
        root.scale.setScalar(2.5 / Math.max(size.x, size.y, size.z));
        const mount = new THREE.Group();
        mount.position.x = x;
        mount.add(root);
        group.add(mount);
      }

      fitModel(loadedAssets[0].scene, -1.45, "#70432f");
      fitModel(loadedAssets[1].scene, 1.45, "#171417");
      document.querySelector("#status").textContent = "PASS — Bob and short GLB meshes loaded";
      document.body.dataset.testStatus = "passed";

      function resize() {
        renderer.setSize(innerWidth, innerHeight, false);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
      }
      addEventListener("resize", resize);
      resize();

      function render(now) {
        group.rotation.y = Math.sin(now * 0.00045) * 0.45;
        renderer.render(scene, camera);
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    </script>
  </body>
</html>
